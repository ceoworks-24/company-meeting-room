<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미팅룸 예약</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 제목+예약 버튼, 날짜 이동 툴바, 시간표(일/주) 위에 예약 블록, 입력/상세는 가운데 패널 */
:root{
  --bg:#F3F5F2;
  --surface:#FFFFFF;
  --ink:#18221E;
  --muted:#5B6862;
  --line:#D6DDD8;
  --line-soft:#E8EDE9;
  --today:#F1F7F4;
  --accent:#1D5A49;
  --accent-ink:#FFFFFF;
  --other:#DCE6F1;
  --other-ink:#1E3248;
  --other-line:#B6C8DB;
  --danger:#B03A2E;
  --now:#D9482B;
  --font:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --slot:26px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101613;--surface:#18201C;--ink:#E8EEEA;--muted:#9AA79F;--line:#2D3832;--line-soft:#222B26;--today:#1B2621;
    --accent:#5FBF9F;--accent-ink:#0B1A14;--other:#223244;--other-ink:#D2E2F3;--other-line:#37526D;--danger:#E8796B;--now:#FF7A5C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;margin-bottom:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 12px}
.range{font-weight:600;font-size:16px;flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 16px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cal{display:grid;grid-template-columns:48px repeat(var(--n),minmax(var(--colmin),1fr))}
.cal-head{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}
.cal-head .d{font-size:12px;color:var(--muted)}
.cal-head .n{font-weight:600;font-size:15px}
.cal-head.today .n{color:var(--accent)}
.cal-head.today .d{color:var(--accent)}
.corner,.gutter{position:sticky;left:0;z-index:3;background:var(--surface)}
.corner{border-bottom:1px solid var(--line)}
.gutter{position:sticky;height:calc(var(--slots)*var(--slot))}
.gutter span{position:absolute;right:6px;font:11px var(--mono);color:var(--muted);transform:translateY(-50%)}
.col{position:relative;height:calc(var(--slots)*var(--slot));border-left:1px solid var(--line);cursor:pointer;
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--slot)*2 - 1px),var(--line) calc(var(--slot)*2 - 1px),var(--line) calc(var(--slot)*2)),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--slot) - 1px),var(--line-soft) calc(var(--slot) - 1px),var(--line-soft) var(--slot));}
.col.today{background-color:var(--today)}
.col.disabled{cursor:default}
.bk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 7px;text-align:left;border:1px solid;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.bk.mine{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bk.other{background:var(--other);color:var(--other-ink);border-color:var(--other-line)}
.bk .t{font-weight:600;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .m{font:11px/1.35 var(--mono);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.note{margin:10px 2px 0;color:var(--muted);font-size:13px;min-height:20px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 2px 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid}
.legend .a{background:var(--accent);border-color:var(--accent)}
.legend .b{background:var(--other);border-color:var(--other-line)}
.overlay{position:fixed;inset:0;background:rgba(8,14,11,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(440px,100%);max-height:100%;overflow:auto;padding:20px}
.panel h2{margin:0 0 14px;font-size:18px;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin:0 0 10px;min-height:0;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0 0 16px}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mh{padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.mh.sun{color:var(--danger)}
.mc{min-height:104px;padding:6px 5px;border-bottom:1px solid var(--line-soft);border-left:1px solid var(--line-soft);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mc:nth-child(7n+1){border-left:0}
.mc:hover{background:var(--today)}
.mc.out{opacity:.45}
.mc.past .dn{color:var(--muted)}
.dn{font-size:13px;font-weight:500;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.mc.today .dn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chip{border:1px solid;border-radius:5px;padding:1px 5px;font-size:11.5px;line-height:1.4;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:block;width:100%}
.chip.mine{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.other{background:var(--other);color:var(--other-ink);border-color:var(--other-line)}
.chip .ct{font-family:var(--mono);font-size:10.5px;opacity:.85}
.more{font-size:11px;color:var(--muted);padding-left:2px}
.tl{display:none;flex-direction:column;align-items:center;gap:2px;width:100%}
.tl .t{font:10px/1.5 var(--mono);padding:0 3px;border-radius:4px;border:1px solid;white-space:nowrap}
.tl .t.mine{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl .t.other{background:var(--other);color:var(--other-ink);border-color:var(--other-line)}
.tl .tmore{font-size:10px;color:var(--muted)}
.panel .items{margin-bottom:14px}
@media (max-width:560px){
  .mc{min-height:92px;padding:4px 2px;align-items:center}
  .chip,.more{display:none}
  .tl{display:flex}
}
.chip{white-space:normal;overflow-wrap:anywhere;text-overflow:clip}
.chip .cn{opacity:.85}
.mc.past{cursor:default}
.mc.past:hover{background:transparent}
.list{margin-top:28px}
.lh{margin:0 0 10px;font-size:16px;font-weight:600}
.items{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.dh{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line-soft)}
.dh.today{color:var(--accent)}
.it{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);background:transparent;padding:10px 14px;cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover{background:var(--today)}
.it .tm{font:13px var(--mono);color:var(--muted)}
.it .tt{font-weight:500;overflow-wrap:anywhere}
.it .by{font-size:13px;color:var(--muted)}
.it .rp{grid-column:2/4;justify-self:start;font-size:11px;color:var(--accent)}
.it.mine .by{color:var(--accent);font-weight:500}
.more-btn{margin-top:10px;width:100%}
.help{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.help p{margin:0 0 4px}
.help a{color:var(--accent)}
@media (max-width:520px){.it{grid-template-columns:minmax(0,1fr) auto}.it .tm{grid-column:1/3}.it .rp{grid-column:1/3}}
@media (max-width:520px){.range{flex-basis:100%}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>미팅룸 예약</h1>
    </div>
    <button class="btn primary" id="new-btn" type="button">예약하기</button>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="bar">
    <div class="nav">
      <button class="btn" id="prev" type="button" aria-label="이전">‹</button>
      <button class="btn" id="today" type="button">오늘</button>
      <button class="btn" id="next" type="button" aria-label="다음">›</button>
    </div>
    <div class="range" id="range" aria-live="polite"></div>
  </div>
  <div class="cal-scroll" id="cal-scroll"></div>
  <p class="note" id="note"></p>
  <div class="legend"><span><i class="a"></i>내가 예약한 건</span><span><i class="b"></i>다른 팀원 예약</span></div>
  <section class="list" id="list" aria-label="예약 목록"></section>
  <footer class="help">
    <p>수정요청, 버그제보, 기타문의는 언제든지 연락주세요</p>
    <p><a href="https://open.kakao.com/me/ceo24" target="_blank" rel="noopener">카카오톡 1:1 메시지 바로가기</a></p>
  </footer>
</div>
<div id="overlay-root"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, query, where, runTransaction, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

(function(){
  var START=9*60, END=19*60, STEP=30;
  var SLOTS=(END-START)/STEP, SLOT_H=26;
  var DOW=['일','월','화','수','목','금','토'];
  var REPEATS={none:'반복 안 함',weekly:'매주',biweekly:'격주',weekdays:'평일 매일'};
  var MAX_OCC=200;
  var DB=null;

  function $(id){return document.getElementById(id);}
  function h(tag,props){
    var e=document.createElement(tag);
    props=props||{};
    for(var k in props){
      var v=props[k];
      if(k==='class')e.className=v;
      else if(k==='text')e.textContent=v;
      else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
      else if(v===true)e.setAttribute(k,'');
      else if(v!==false&&v!=null)e.setAttribute(k,v);
    }
    for(var i=2;i<arguments.length;i++){
      var list=[].concat(arguments[i]);
      for(var j=0;j<list.length;j++){
        var c=list[j];
        if(c==null||c===false)continue;
        e.append(c.nodeType?c:document.createTextNode(c));
      }
    }
    return e;
  }
  function pad(n){return String(n).padStart(2,'0');}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
  function dayLabel(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function todayStr(){return ymd(new Date());}
  function mondayOf(d){var x=new Date(d);var w=x.getDay();x.setDate(x.getDate()+(w===0?-6:1-w));return x;}

  var S={
    view:'month',listLimit:20,panelFrom:null,
    cursor:new Date(),
    bookings:[],meId:null,myName:'',db:null,
    canWrite:false,loaded:false,error:'',
    panel:null
  };
  S.cursor.setHours(0,0,0,0);

  function nameOf(b){return (b&&b.byName)||'이름 없음';}

  /* ---------- 달력 ---------- */
  function renderToolbar(){
    $('range').textContent=S.cursor.getFullYear()+'년 '+(S.cursor.getMonth()+1)+'월';
    $('new-btn').disabled=!S.canWrite;
  }

  function renderBanner(){
    var b=$('banner');
    b.hidden=!S.error;
    b.textContent=S.error||'';
  }

  function renderGrid(){
    renderToolbar();
    renderBanner();
    renderMonth();
    renderList();
  }

  function defaultStart(ds){
    var st=10*60;
    if(ds===todayStr()){
      var n=new Date();
      var m=Math.ceil((n.getHours()*60+n.getMinutes())/STEP)*STEP;
      if(m>st)st=m;
    }
    return Math.min(Math.max(st,START),END-STEP);
  }

  function renderMonth(){
    var y=S.cursor.getFullYear(),mo=S.cursor.getMonth();
    var first=new Date(y,mo,1),last=new Date(y,mo+1,0);
    var gridStart=addDays(first,-first.getDay());
    var weeks=Math.ceil((first.getDay()+last.getDate())/7);
    var wrap=h('div',{class:'month'});
    DOW.forEach(function(w,i){wrap.append(h('div',{class:'mh'+(i===0?' sun':(i===6?' sat':'')),text:w}));});
    var byDate={};
    S.bookings.forEach(function(b){(byDate[b.date]=byDate[b.date]||[]).push(b);});
    var tStr=todayStr(),total=0;
    for(var i=0;i<weeks*7;i++){
      (function(){
        var d=addDays(gridStart,i),ds=ymd(d);
        var list=(byDate[ds]||[]).slice().sort(function(a,b){return a.start-b.start;});
        var inM=d.getMonth()===mo;
        if(inM)total+=list.length;
        var cell=h('div',{class:'mc'+(inM?'':' out')+(ds===tStr?' today':'')+(ds<tStr?' past':''),role:'button',tabindex:'0',
          'aria-label':dayLabel(d)+(list.length?', 예약 '+list.length+'건':', 예약 없음')+(ds<tStr?'':', 눌러서 예약')});
        function go(){
          if(list.length){openDay(ds);return;}
          if(!S.canWrite)return;
          if(ds<tStr){toast('지난 날짜에는 예약할 수 없습니다.');return;}
          var st=defaultStart(ds);
          openForm({date:ds,start:st,end:Math.min(st+60,END)});
        }
        cell.addEventListener('click',go);
        cell.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
        cell.append(h('span',{class:'dn',text:String(d.getDate())}));
        list.slice(0,3).forEach(function(b){
          var mine=b.by&&b.by===S.meId;
          cell.append(h('button',{type:'button',class:'chip '+(mine?'mine':'other'),
            onclick:function(e){e.stopPropagation();openDetail(b.id);}},
            h('span',{class:'ct',text:hm(b.start)}),' ',b.title,' ',h('span',{class:'cn',text:'· '+nameOf(b)})));
        });
        if(list.length>3)cell.append(h('span',{class:'more',text:'+'+(list.length-3)+'건 더'}));
        if(list.length){
          var tl=h('div',{class:'tl','aria-hidden':'true'});
          list.slice(0,3).forEach(function(b){
            tl.append(h('span',{class:'t '+(b.by&&b.by===S.meId?'mine':'other'),text:hm(b.start)+'-'}));
          });
          if(list.length>3)tl.append(h('span',{class:'tmore',text:'+'+(list.length-3)}));
          cell.append(tl);
        }
        wrap.append(cell);
      })();
    }
    $('cal-scroll').replaceChildren(wrap);
    var note='';
    if(!S.db)note='';
    else if(!S.loaded)note='예약 내용을 불러오는 중입니다.';
    else if(total===0)note='이번 달 예약이 없습니다. 날짜를 눌러 예약하세요.';
    else note='이번 달 예약 '+total+'건 · 날짜를 누르면 그날 예약을 볼 수 있습니다.';
    $('note').textContent=note;
  }

  function renderList(){
    var box=$('list');
    box.replaceChildren(h('h2',{class:'lh',text:'예약 목록'}));
    if(!S.db)return;
    if(!S.loaded){box.append(h('p',{class:'note',text:'불러오는 중입니다.'}));return;}
    var t=todayStr(),n=new Date(),nowMin=n.getHours()*60+n.getMinutes(),thisYear=n.getFullYear();
    var up=S.bookings.filter(function(b){return b.date>t||(b.date===t&&b.end>nowMin);})
      .sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:a.start-b.start);});
    if(!up.length){box.append(h('p',{class:'note',text:'앞으로 예정된 예약이 없습니다.'}));return;}
    var shown=up.slice(0,S.listLimit),lastDate='';
    var items=h('div',{class:'items'});
    shown.forEach(function(b){
      if(b.date!==lastDate){
        lastDate=b.date;
        var dd=parse(b.date);
        items.append(h('div',{class:'dh'+(b.date===t?' today':''),
          text:(b.date===t?'오늘 · ':'')+(dd.getFullYear()!==thisYear?dd.getFullYear()+'년 ':'')+dayLabel(dd)}));
      }
      var mine=b.by&&b.by===S.meId;
      items.append(h('button',{type:'button',class:'it'+(mine?' mine':''),onclick:function(){openDetail(b.id);}},
        h('span',{class:'tm',text:hm(b.start)+'–'+hm(b.end)}),
        h('span',{class:'tt',text:b.title}),
        h('span',{class:'by',text:nameOf(b)}),
        b.seriesId?h('span',{class:'rp',text:'반복 · '+(REPEATS[b.repeat]||'')}):null));
    });
    box.append(items);
    if(up.length>shown.length){
      box.append(h('button',{type:'button',class:'btn more-btn',text:'더 보기 ('+(up.length-shown.length)+'건 남음)',
        onclick:function(){S.listLimit+=20;renderList();}}));
    }
  }

  /* ---------- 패널 공통 ---------- */
  function closePanel(){
    S.panel=null;S.panelFrom=null;
    $('overlay-root').replaceChildren();
  }
  function showPanel(content,opts){
    var root=$('overlay-root');
    var ov=h('div',{class:'overlay',onmousedown:function(e){if(e.target===ov)closePanel();}},
      h('div',{class:'panel',role:'dialog','aria-modal':'true','aria-label':opts.label},content));
    root.replaceChildren(ov);
    var f=ov.querySelector('[data-autofocus]')||ov.querySelector('button');
    if(f)f.focus();
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.panel)closePanel();});

  var toastTimer;
  function toast(msg,ms){
    var t=$('toast');
    t.textContent=msg;t.hidden=false;
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.hidden=true;},ms||2600);
  }

  /* ---------- 예약 계산 ---------- */
  function occurrences(date,repeat,until){
    if(repeat==='none')return [date];
    var out=[],d=parse(date),end=parse(until),guard=0;
    while(d<=end&&out.length<MAX_OCC&&guard<800){
      guard++;
      var w=d.getDay();
      if(repeat==='weekdays'){
        if(w!==0&&w!==6)out.push(ymd(d));
        d=addDays(d,1);
      }else{
        out.push(ymd(d));
        d=addDays(d,repeat==='weekly'?7:14);
      }
    }
    return out;
  }

  /* 30분마다 칸(slots 문서)을 하나씩 잡아서, 같은 칸을 두 사람이 동시에 잡지 못하게 합니다. */
  function slotIds(date,start,end){
    var a=[];
    for(var m=start;m<end;m+=STEP)a.push(date+'_'+pad(Math.floor(m/60))+pad(m%60));
    return a;
  }
  function localConflicts(dates,start,end){
    var set=new Set(dates);
    return S.bookings.filter(function(b){
      return set.has(b.date)&&b.start<end&&start<b.end;
    });
  }
  function chunks(arr,n){
    var out=[];
    for(var i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));
    return out;
  }

  /* 비밀번호는 예약 번호와 섞어서 암호화(SHA-256)한 값만 저장합니다. 이 값은 아무도 읽을 수 없는 secrets 문서에 들어갑니다. */
  async function sha256(str){
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  }
  function pinHash(id,pin){return sha256('mr1|'+id+'|'+pin);}

  async function place(data,pin){
    var ref=doc(collection(DB,'bookings'));
    var ids=slotIds(data.date,data.start,data.end);
    var pw=await pinHash(ref.id,pin);
    await runTransaction(DB,async function(tx){
      var snaps=await Promise.all(ids.map(function(s){return tx.get(doc(DB,'slots',s));}));
      for(var i=0;i<snaps.length;i++){
        if(snaps[i].exists())throw {kind:'conflict'};
      }
      ids.forEach(function(s){tx.set(doc(DB,'slots',s),{bid:ref.id,date:data.date});});
      tx.set(doc(DB,'secrets',ref.id),{pwHash:pw});
      tx.set(ref,data);
    });
  }

  /* ---------- 예약 폼 ---------- */
  function timeSelect(id,from,to,val){
    var s=h('select',{id:id});
    for(var m=from;m<=to;m+=STEP)s.append(h('option',{value:m,text:hm(m)}));
    s.value=String(val);
    return s;
  }

  function openForm(init){
    if(!S.canWrite)return;
    var cur=ymd(S.cursor)<todayStr()?todayStr():ymd(S.cursor);
    var f=Object.assign({title:'',date:cur,start:10*60,end:11*60,repeat:'none'},init||{});
    S.panel={type:'form'};

    var title=h('input',{id:'f-title',type:'text',maxlength:'60',placeholder:'예: 미팅','data-autofocus':true,value:f.title});
    var who=h('input',{id:'f-name',type:'text',maxlength:'30',placeholder:'예: 홍길동',value:S.myName});
    var pin=h('input',{id:'f-pin',type:'text',inputmode:'numeric',pattern:'[0-9]*',maxlength:'4',autocomplete:'off',placeholder:'숫자 4자리'});
    var date=h('input',{id:'f-date',type:'date',min:todayStr(),value:f.date});
    var start=timeSelect('f-start',START,END-STEP,f.start);
    var end=timeSelect('f-end',START+STEP,END,f.end);
    start.addEventListener('change',function(){
      if(+end.value<=+start.value)end.value=String(Math.min(+start.value+60,END));
    });
    var repeat=h('select',{id:'f-repeat'});
    Object.keys(REPEATS).forEach(function(k){repeat.append(h('option',{value:k,text:REPEATS[k]}));});
    repeat.value=f.repeat;
    var until=h('input',{id:'f-until',type:'date',min:todayStr(),value:ymd(addDays(parse(f.date),28))});
    var endMode=h('select',{id:'f-endmode'},
      h('option',{value:'date',text:'종료일 지정'}),
      h('option',{value:'none',text:'종료 없음 (6개월 치를 미리 예약)'}));
    var untilWrap=h('div',{class:'field'},h('label',{for:'f-until',text:'반복 종료일'}),until);
    var untilField=h('div',{},h('div',{class:'field'},h('label',{for:'f-endmode',text:'반복 기간'}),endMode),untilWrap);
    function syncRepeat(){
      untilField.hidden=repeat.value==='none';
      untilWrap.hidden=endMode.value==='none';
    }
    repeat.addEventListener('change',syncRepeat);
    endMode.addEventListener('change',syncRepeat);
    function pop(el){el.addEventListener('click',function(){try{if(el.showPicker)el.showPicker();}catch(x){}});}
    pop(date);pop(until);
    var dateLabel=h('label',{for:'f-date',text:'날짜'});
    function showDow(){dateLabel.textContent=date.value?'날짜 ('+DOW[parse(date.value).getDay()]+'요일)':'날짜';}
    date.addEventListener('input',showDow);
    date.addEventListener('change',showDow);
    date.addEventListener('change',function(){
      if(date.value)until.value=ymd(addDays(parse(date.value),28));
    });
    showDow();

    var err=h('p',{class:'err',role:'alert'});
    var skipBtn=h('button',{type:'button',class:'btn',hidden:true,text:'겹치는 날 빼고 예약'});
    var okBtn=h('button',{type:'submit',class:'btn primary',text:'예약하기'});
    var cancelBtn=h('button',{type:'button',class:'btn',text:'닫기',onclick:closePanel});

    function showConflict(list,all,okCount){
      var lines=list.slice(0,5).map(function(c){
        return dayLabel(parse(c.date))+' '+hm(c.start)+'–'+hm(c.end)+' · '+c.title+' ('+nameOf(c)+')';
      });
      if(list.length>5)lines.push('외 '+(list.length-5)+'건');
      err.textContent='이미 예약된 시간과 겹칩니다.\n'+lines.join('\n');
      if(!all&&okCount>0){
        skipBtn.hidden=false;
        skipBtn.textContent='겹치는 날 빼고 '+okCount+'건 예약';
      }
    }

    async function run(skip){
      err.textContent='';skipBtn.hidden=true;
      var t=title.value.trim(),nm=who.value.trim(),pw=pin.value.trim(),d=date.value,s=+start.value,e=+end.value;
      if(!t){err.textContent='회의 제목을 입력하세요.';title.focus();return;}
      if(!nm){err.textContent='예약자 이름을 입력하세요.';who.focus();return;}
      if(!/^[0-9]{4}$/.test(pw)){err.textContent='비밀번호는 숫자 4자리로 입력하세요.';pin.focus();return;}
      if(!d){err.textContent='날짜를 선택하세요.';return;}
      if(d<todayStr()){err.textContent='지난 날짜에는 예약할 수 없습니다.';return;}
      if(e<=s){err.textContent='종료 시간이 시작 시간보다 뒤여야 합니다.';return;}
      var nowD=new Date();
      if(d===todayStr()&&e<=nowD.getHours()*60+nowD.getMinutes()){err.textContent='이미 지난 시간입니다.';return;}
      var rep=repeat.value;
      var untilStr=endMode.value==='none'?ymd(addDays(parse(d),183)):until.value;
      if(rep!=='none'&&endMode.value==='date'&&(!until.value||until.value<d)){err.textContent='반복 종료일을 시작 날짜 이후로 선택하세요.';return;}
      okBtn.disabled=true;skipBtn.disabled=true;
      try{
        var made=0,failed=0;
        S.myName=nm;
        try{localStorage.setItem('mr-name',nm);}catch(x){}
        var dates=occurrences(d,rep,untilStr);
        var cfs=localConflicts(dates,s,e);
        var bad=new Set(cfs.map(function(c){return c.date;}));
        var good=dates.filter(function(x){return !bad.has(x);});
        if(!good.length||(bad.size&&!skip)){
          showConflict(cfs,good.length===0,good.length);
          okBtn.disabled=false;skipBtn.disabled=false;return;
        }
        var sid=rep!=='none'?(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2)):null;
        for(var i=0;i<good.length;i++){
          if(good.length>1)okBtn.textContent='예약 중… '+(i+1)+'/'+good.length;
          try{
            await place({title:t,date:good[i],start:s,end:e,by:S.meId,byName:nm,seriesId:sid,repeat:rep,createdAt:Date.now()},pw);
            made++;
          }catch(x){
            if(x&&x.kind==='conflict')failed++;else throw x;
          }
        }
        S.cursor=parse(d);
        closePanel();
        renderGrid();
        if(made===0)toast('다른 사람이 방금 같은 시간을 예약했습니다.');
        else toast((made>1?made+'건을 예약했습니다.':'예약했습니다.')+(failed?' ('+failed+'건은 방금 다른 예약과 겹쳐 제외)':'')+' 취소 비밀번호: '+pw,6000);
      }catch(x){
        okBtn.disabled=false;skipBtn.disabled=false;okBtn.textContent='예약하기';
        if(x&&x.kind==='conflict')err.textContent='다른 사람이 방금 같은 시간을 예약했습니다. 달력을 확인하고 다시 시도하세요.';
        else err.textContent='저장하지 못했습니다. 인터넷 연결과 Firebase 설정(규칙 포함)을 확인하고 다시 시도하세요.';
      }
    }
    skipBtn.addEventListener('click',function(){run(true);});
    var form=h('form',{novalidate:true,onsubmit:function(ev){ev.preventDefault();run(false);}},
      h('div',{class:'field'},h('label',{for:'f-title',text:'회의 제목'}),title),
      h('div',{class:'field'},h('label',{for:'f-name',text:'예약자 이름'}),who),
      h('div',{class:'field'},h('label',{for:'f-pin',text:'취소용 비밀번호 (숫자 4자리)'}),pin,
        h('span',{class:'hint',text:'예약을 취소할 때 필요합니다. 수정은 할 수 없으니, 바꾸려면 취소 후 다시 예약하세요.'})),
      h('div',{class:'field'},dateLabel,date),
      h('div',{class:'row2'},
        h('div',{class:'field'},h('label',{for:'f-start',text:'시작'}),start),
        h('div',{class:'field'},h('label',{for:'f-end',text:'종료'}),end)
      ),
      h('div',{class:'field'},h('label',{for:'f-repeat',text:'반복'}),repeat),
      untilField,
      err,
      h('div',{class:'actions'},cancelBtn,skipBtn,okBtn)
    );
    syncRepeat();
    showPanel([h('h2',{text:'미팅룸 예약'}),form],{label:'미팅룸 예약'});
    if(S.myName)title.focus();else who.focus();
  }

  /* ---------- 날짜별 목록 / 상세 / 취소 ---------- */
  function openDay(ds){
    var d=parse(ds);
    S.panel={type:'day',date:ds};
    S.panelFrom=ds;
    var list=S.bookings.filter(function(b){return b.date===ds;}).sort(function(a,b){return a.start-b.start;});
    var items=h('div',{class:'items'});
    list.forEach(function(b){
      var mine=b.by&&b.by===S.meId;
      items.append(h('button',{type:'button',class:'it'+(mine?' mine':''),onclick:function(){openDetail(b.id);}},
        h('span',{class:'tm',text:hm(b.start)+'–'+hm(b.end)}),
        h('span',{class:'tt',text:b.title}),
        h('span',{class:'by',text:nameOf(b)}),
        b.seriesId?h('span',{class:'rp',text:'반복 · '+(REPEATS[b.repeat]||'')}):null));
    });
    var canBook=S.canWrite&&ds>=todayStr();
    showPanel([
      h('h2',{text:d.getFullYear()+'년 '+dayLabel(d)}),
      list.length?items:h('p',{class:'sub',text:'이 날짜에는 예약이 없습니다.'}),
      h('div',{class:'actions'},
        h('button',{type:'button',class:'btn',text:'닫기',onclick:closePanel}),
        canBook?h('button',{type:'button',class:'btn primary',text:'이 날짜에 예약하기','data-autofocus':true,onclick:function(){
          S.panelFrom=null;
          var st=defaultStart(ds);
          openForm({date:ds,start:st,end:Math.min(st+60,END)});
        }}):null)
    ],{label:'날짜별 예약 목록'});
  }

  function openDetail(id,confirmKind){
    var b=S.bookings.filter(function(x){return x.id===id;})[0];
    if(!b)return;
    S.panel={type:'detail',id:id};
    var inSeries=!!b.seriesId;
    var kv=h('dl',{class:'kv'},
      h('dt',{text:'날짜'}),h('dd',{text:parse(b.date).getFullYear()+'년 '+dayLabel(parse(b.date))}),
      h('dt',{text:'시간'}),h('dd',{class:'mono',text:hm(b.start)+' – '+hm(b.end)}),
      h('dt',{text:'예약자'}),h('dd',{text:nameOf(b)}),
      inSeries?h('dt',{text:'반복'}):null,
      inSeries?h('dd',{text:REPEATS[b.repeat]||'반복 예약'}):null
    );
    var body=[h('h2',{text:b.title}),kv];
    if(confirmKind){
      var series=confirmKind==='series';
      var pw=h('input',{id:'c-pin',type:'password',inputmode:'numeric',pattern:'[0-9]*',maxlength:'4',autocomplete:'off',placeholder:'숫자 4자리','data-autofocus':true});
      var err=h('p',{class:'err',role:'alert'});
      var go=h('button',{type:'submit',class:'btn danger solid',text:series?'이후 반복 모두 삭제':'예약 취소'});
      body.push(h('form',{novalidate:true,onsubmit:function(ev){ev.preventDefault();removeBooking(b,series,pw.value.trim(),err,go);}},
        h('p',{class:'sub',text:series?'이 날짜부터 이어지는 반복 예약을 모두 삭제합니다. 되돌릴 수 없습니다.':'이 예약을 삭제합니다. 되돌릴 수 없습니다.'}),
        h('div',{class:'field'},h('label',{for:'c-pin',text:'예약할 때 정한 비밀번호 (숫자 4자리)'}),pw),
        err,
        h('div',{class:'actions'},
          h('button',{type:'button',class:'btn',text:'돌아가기',onclick:function(){openDetail(id);}}),
          go)));
    }else{
      body.push(h('div',{class:'actions'},
        S.panelFrom?h('button',{type:'button',class:'btn',text:'← 목록',onclick:function(){openDay(S.panelFrom);}}):null,
        h('button',{type:'button',class:'btn',text:'닫기',onclick:closePanel}),
        inSeries?h('button',{type:'button',class:'btn danger',text:'이후 반복 모두 취소',onclick:function(){openDetail(id,'series');}}):null,
        h('button',{type:'button',class:'btn danger',text:'예약 취소','data-autofocus':true,onclick:function(){openDetail(id,'one');}})
      ));
    }
    showPanel(body,{label:'예약 상세'});
  }

  async function removeBooking(b,series,pw,err,btn){
    err.textContent='';
    if(!/^[0-9]{4}$/.test(pw)){err.textContent='비밀번호 숫자 4자리를 입력하세요.';return;}
    btn.disabled=true;
    try{
      var list=[b];
      if(series&&b.seriesId){
        var snap=await getDocs(query(collection(DB,'bookings'),where('seriesId','==',b.seriesId)));
        list=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());})
          .filter(function(x){return x.date>=b.date;});
      }
      /* 1단계: 비밀번호 확인 (맞지 않으면 여기서 막혀 아무것도 지워지지 않습니다) */
      var groups=chunks(list,15),g,k;
      for(g=0;g<groups.length;g++){
        var proof=writeBatch(DB);
        for(k=0;k<groups[g].length;k++){
          proof.set(doc(DB,'cancels',groups[g][k].id),{proof:await pinHash(groups[g][k].id,pw)});
        }
        try{await proof.commit();}
        catch(e){
          if(e&&e.code==='permission-denied'){err.textContent='비밀번호가 맞지 않습니다.';btn.disabled=false;return;}
          throw e;
        }
      }
      /* 2단계: 예약, 30분 칸, 비밀번호 정보 삭제 */
      for(g=0;g<groups.length;g++){
        var bb=writeBatch(DB);
        groups[g].forEach(function(x){bb.delete(doc(DB,'bookings',x.id));});
        await bb.commit();
      }
      var slots=[];
      list.forEach(function(x){slotIds(x.date,x.start,x.end).forEach(function(sid){slots.push(sid);});});
      var sg=chunks(slots,15);
      for(g=0;g<sg.length;g++){
        var sb=writeBatch(DB);
        sg[g].forEach(function(sid){sb.delete(doc(DB,'slots',sid));});
        await sb.commit();
      }
      var rg=chunks(list,7);
      for(g=0;g<rg.length;g++){
        var rb=writeBatch(DB);
        rg[g].forEach(function(x){rb.delete(doc(DB,'secrets',x.id));rb.delete(doc(DB,'cancels',x.id));});
        await rb.commit();
      }
      closePanel();
      toast(list.length>1?list.length+'건을 취소했습니다.':'예약을 취소했습니다.');
    }catch(e){
      btn.disabled=false;
      err.textContent='취소하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.';
    }
  }

  /* ---------- 이동 / 보기 ---------- */
  function shift(dir){
    S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+dir,1);
    renderGrid();
  }
  $('prev').addEventListener('click',function(){shift(-1);});
  $('next').addEventListener('click',function(){shift(1);});
  $('today').addEventListener('click',function(){S.cursor=new Date();S.cursor.setHours(0,0,0,0);renderGrid();});
  $('new-btn').addEventListener('click',function(){openForm();});

  /* ---------- 시작 ---------- */
  function boot(){
    try{
      S.myName=localStorage.getItem('mr-name')||'';
      S.meId=localStorage.getItem('mr-device');
      if(!S.meId){S.meId=(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));localStorage.setItem('mr-device',S.meId);}
    }catch(e){S.meId=S.meId||String(Date.now());}
    var cfg=firebaseConfig||{};
    if(!cfg.apiKey||/붙여|PASTE/i.test(cfg.apiKey)||!cfg.projectId){
      S.error='아직 Firebase 설정이 입력되지 않았습니다. firebase-config.js 파일에 Firebase에서 복사한 값을 붙여 넣으세요. (README 3단계)';
      renderGrid();return;
    }
    try{
      DB=getFirestore(initializeApp(cfg));
      S.db=DB;S.canWrite=true;
      renderGrid();
      var from=ymd(addDays(new Date(),-60));
      onSnapshot(query(collection(DB,'bookings'),where('date','>=',from)),function(snap){
        S.bookings=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        S.loaded=true;S.error='';
        if(S.panel&&S.panel.type==='detail'&&!S.bookings.some(function(b){return b.id===S.panel.id;}))closePanel();
        else if(S.panel&&S.panel.type==='day')openDay(S.panel.date);
        renderGrid();
      },function(){
        S.error='예약 목록을 불러오지 못했습니다. Firebase 규칙(README 2단계)과 인터넷 연결을 확인하세요.';
        renderGrid();
      });
    }catch(e){
      S.error='Firebase에 연결하지 못했습니다. firebase-config.js 값을 다시 확인하세요.';
      renderGrid();
    }
  }
  setInterval(function(){if(!S.panel)renderGrid();},60000);
  boot();
})();
</script>
